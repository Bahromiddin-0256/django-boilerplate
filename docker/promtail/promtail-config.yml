server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs using service discovery
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_logging']
        target_label: 'logging'
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
      - output:
          source: output

  # Django application logs (if writing to file)
  - job_name: django
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          service: web
          __path__: /app/logs/*.log

  # Celery worker logs
  - job_name: celery
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery
          service: worker
          __path__: /app/logs/celery*.log
