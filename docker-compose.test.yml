# Test Environment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit
# CI Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm web

services:
  web:
    build:
      target: test
    command: python manage.py test --verbosity=2 --keepdb
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=core.settings.test
      - DB_NAME=test_db
    restart: "no"
    # No ports exposed for testing

  # Disable Celery workers for unit tests (tasks run eagerly)
  celery:
    profiles:
      - integration
    build:
      target: test
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.test
    restart: "no"

  celery-beat:
    profiles:
      - integration
    build:
      target: test
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.test
    restart: "no"

  db:
    environment:
      POSTGRES_DB: test_db
    # Use tmpfs for faster test database
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"

  redis:
    # Use tmpfs for faster test cache
    tmpfs:
      - /data
    restart: "no"