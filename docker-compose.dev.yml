# Development Environment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    build:
      target: development
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --worker-tmp-dir /dev/shm --access-logfile - --error-logfile - --reload
    volumes:
      - .:/app
      - /app/.venv  # Exclude venv from bind mount
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings.develop
    stdin_open: true
    tty: true
    restart: "no"

  celery:
    build:
      target: development
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings.develop
    restart: "no"

  celery-beat:
    build:
      target: development
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings.develop
    restart: "no"

  db:
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: "no"

  redis:
#    ports:
#      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: "no"

  # Optional: PgAdmin for database management in development
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: "no"
    profiles:
      - tools

  # Optional: Mailpit for email testing in development
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    restart: "no"
    profiles:
      - tools

  # Loki - Log aggregation
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: "no"
    user: "0"  # Run as root to avoid permission issues with /loki directory
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Promtail - Log shipper
  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana - Log visualization
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_dev_data:
  redis_dev_data:
  pgadmin_data:
  loki_data:
  grafana_data: